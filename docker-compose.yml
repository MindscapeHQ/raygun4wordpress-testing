services:
   runner:
     depends_on:
       db:
         condition: service_healthy
       # Waits for wordpress in run_tests.sh
     image: wordpress:cli
     profiles: ["test"]
     environment:
       HOME: "/tmp"
       # You can enable WordPress debug logging here:
       WORDPRESS_DEBUG_MODE: false
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress
       WORDPRESS_DB_NAME: wordpress
       WORDPRESS_TABLE_PREFIX: "wp_"
     env_file:
       - settings.env
     volumes:
       - wp_data:/var/www/html
       - ./scripts:/scripts
       - ./plugins:/plugins
     # wordpress:cli runs www-data as 82, the wordpress image owns files as 33
     user: "33:33"
     entrypoint: bash /scripts/run_tests.sh

   wordpress:
     depends_on:
       db:
         condition: service_healthy
     # You can modify the WordPress version here:
     image: wordpress:latest
     profiles: ["test"]
     volumes:
       - wp_data:/var/www/html
     ports:
       - 127.0.0.1:8000:80
     environment:
       WORDPRESS_DB_HOST: db:3306
       WORDPRESS_DB_USER: wordpress
       WORDPRESS_DB_PASSWORD: wordpress
       WORDPRESS_DB_NAME: wordpress
       WORDPRESS_TABLE_PREFIX: "wp_"

   db:
     image: mariadb:lts
     profiles: ["test"]
     volumes:
       - db_data:/var/lib/mysql
     restart: always
     environment:
       MARIADB_AUTO_UPGRADE: 1
       MYSQL_ROOT_PASSWORD: wordpress
       MYSQL_DATABASE: wordpress
       MYSQL_USER: wordpress
       MYSQL_PASSWORD: wordpress
     healthcheck:
       test: healthcheck.sh --connect --innodb_initialized
       interval: 5s
       retries: 4
       timeout: 10s

   submodule-updater:
     image: alpine/git:latest
     profiles: ["update"]
     env_file:
       - settings.env
     volumes:
       - ./:/repository
     entrypoint: ash /repository/scripts/update_submodule.sh

   cleaner:
     image: alpine/git:latest
     profiles: ["clean"]
     env_file:
       - settings.env
     volumes:
       - ./:/repository
     entrypoint: ash /repository/scripts/clean.sh

volumes:
    db_data:
    wp_data: